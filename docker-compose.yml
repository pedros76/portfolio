services:
  portfolio:
    image: peter-portfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GEMINI_API_KEYS: ${VITE_GEMINI_API_KEYS:-}
        VITE_GEMINI_MODEL: ${VITE_GEMINI_MODEL:-gemini-2.5-flash}
    container_name: peter-portfolio
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
